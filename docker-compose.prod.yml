services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE (PostgreSQL 16 - Internal Only)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roboled_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roboled_internal

  # ----------------------------------------------------------------------------
  # 2. CACHE & WORKERS (Redis 7 - Internal Only)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: roboled_prod_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roboled_internal

  # ----------------------------------------------------------------------------
  # 3. APPLICATION BACKEND & SPA
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roboled_prod_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    volumes:
      - app_uploads_prod:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - roboled_internal

  # ----------------------------------------------------------------------------
  # 4. NGINX REVERSE PROXY
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: roboled_prod_nginx
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - roboled_internal
      - roboled_public

  # ----------------------------------------------------------------------------
  # 5. CLOUDFLARE TUNNEL (Zero Trust Exposure)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: roboled_prod_tunnel
    restart: always
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - roboled_public

volumes:
  postgres_prod_data:
  redis_prod_data:
  app_uploads_prod:

networks:
  roboled_internal:
    internal: true
  roboled_public:
    driver: bridge
