services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roboled_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roboled_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roboled_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-roboled_marketing_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roboled_user} -d ${POSTGRES_DB:-roboled_marketing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roboled_network

  # ----------------------------------------------------------------------------
  # 2. QUEUE & CACHE (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: roboled_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-roboled_redis_secret}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-roboled_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roboled_network

  # ----------------------------------------------------------------------------
  # 3. APPLICATION (Node.js + Express + React SPA)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roboled_marketing_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-roboled_user}:${POSTGRES_PASSWORD:-roboled_secure_password_123}@postgres:5432/${POSTGRES_DB:-roboled_marketing_db}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-roboled_redis_secret}@redis:6379"
    volumes:
      - app_uploads:/app/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - roboled_network

  # ----------------------------------------------------------------------------
  # 4. REVERSE PROXY (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: roboled_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - roboled_network

volumes:
  postgres_data:
  redis_data:
  app_uploads:

networks:
  roboled_network:
    driver: bridge
